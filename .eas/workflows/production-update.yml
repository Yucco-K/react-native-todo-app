name: Production OTA Update

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests, Lint, Biome & Type Check
    type: generic
    command:
      - npm install
      - npm run lint
      - npm run biome:check:ci
      - npx tsc --noEmit
      - npm run test -- --ci

  update:
    name: Deploy to Production
    type: update
    needs: test
    params:
      branch: production
      message: "Auto-deploy: ${{ github.event.head_commit.message }}"
